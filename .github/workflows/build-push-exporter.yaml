name: openstack-network-exporter image builder

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - .gitignore
      - .pull_request_pipeline
      - LICENSE
      - README.rst
      - docs/
      - tests/

permissions:
  contents: read

env:
  imageregistry: 'quay.io'
  imagenamespace: ${{ secrets.IMAGENAMESPACE || secrets.QUAY_USERNAME }}
  latesttag: latest

jobs:

  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        id: have-secrets
        if: "${{ env.imagenamespace != '' }}"
        run: echo "ok=true" >> $GITHUB_OUTPUT
    outputs:
      have-secrets: ${{ steps.have-secrets.outputs.ok }}

  build-push-openstack-network-exporter:
    name: Build openstack-network-exporter image using buildah
    runs-on: ubuntu-latest
    needs: [check-secrets]
    if: needs.check-secrets.outputs.have-secrets == 'true'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set latest tag for non main branch
      if: github.ref_name != 'main'
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "latesttag=${BRANCH_NAME}-latest" >> $GITHUB_ENV

    - name: Buildah Action
      id: build-push-openstack-network-exporter
      uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
      with:
        image: openstack-network-exporter
        tags: ${{ env.latesttag }} ${{ github.sha }} current-podified
        containerfiles: |
          ./Containerfile

    - name: Push openstack-network-exporter To ${{ env.imageregistry }}
      uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
      with:
        image: ${{ steps.build-push-openstack-network-exporter.outputs.image }}
        tags: ${{ steps.build-push-openstack-network-exporter.outputs.tags }}
        registry: ${{ env.imageregistry }}/${{ env.imagenamespace }}
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
