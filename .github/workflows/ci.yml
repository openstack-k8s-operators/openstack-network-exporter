---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make

  build-product:
    name: Product build (ubi10/go-toolset:1.25, CGO, FIPS)
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi10/go-toolset:1.25
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: go-product-${{ hashFiles('go.sum') }}
      - name: Download modules
        run: go mod download
      - name: Generate OVSDB models
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CGO_ENABLED=1 GO111MODULE=on go generate ./...
      - name: Build with product flags
        run: |
          CGO_ENABLED=1 GO111MODULE=on go build \
            -trimpath -mod=readonly -tags=strictfipsruntime -a \
            -o openstack-network-exporter .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make lint
      - run: make shellcheck

  git-commits:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.base.sha && github.event.pull_request.head.sha }}
    env:
      REVISION_RANGE: "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # force fetch all history
      - run: git config --global --add safe.directory $PWD
      - run: make check-commits

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          path: test/logs
          retention-days: 3
