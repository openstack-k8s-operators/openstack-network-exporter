# SPDX-License-Identifier: Apache-2.0
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -xe
          GOOS=linux GOARCH=amd64 make
          mv openstack-network-exporter openstack-network-exporter-linux-amd64
          GOOS=linux GOARCH=arm64 make
          mv openstack-network-exporter openstack-network-exporter-linux-arm64
          sha256sum openstack-network-exporter-linux-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            openstack-network-exporter-linux-amd64
            openstack-network-exporter-linux-arm64
            checksums.txt
          generate_release_notes: true
