# SPDX-License-Identifier: Apache-2.0
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -xe
          GOOS=linux GOARCH=amd64 make
          mv openstack-network-exporter openstack-network-exporter-linux-amd64
          GOOS=linux GOARCH=arm64 make
          mv openstack-network-exporter openstack-network-exporter-linux-arm64
          sha256sum openstack-network-exporter-linux-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            openstack-network-exporter-linux-amd64
            openstack-network-exporter-linux-arm64
            checksums.txt
          generate_release_notes: true
